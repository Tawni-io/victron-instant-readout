; VictronDash — LILYGO T-Display C5

[platformio]
default_envs = bringup_ble
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Lilygo-T-Display-C5
framework = arduino
monitor_speed = 115200
; Avoid USB-CDC reset when opening the serial monitor (ESP32-C5).
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
  h2zero/NimBLE-Arduino@^2.3.0
  lvgl/lvgl@9.2.0
  ; CST816S: vendored LilyGO fork in lib/CST816S (skip Registry fbiego)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -Isrc
  ; CST816S swipe page cycle (ST7789 display + CST816S touch IC). Set 0 to compile out.
  -DUSE_TOUCH_SWIPE=1
  ; Freeze bisect: set to 1 to decode IR without cabin LVGL updates
  ; -DVICTRONDASH_SKIP_CABIN_PAINT=1
  ; Task WDT panic after hang (ms). Set 0 to disable.
  -DVICTRONDASH_TASK_WDT_MS=12000
monitor_filters = esp32_exception_decoder
; Strip C:/Users/<host>/... from __FILE__ in every env (release .bin must not leak it).
extra_scripts = pre:tools/pio_strip_host_paths.py

[env:bringup_ble]
; SoftAP / BLE cabin gauge. Field SoftAP OTA keeps NVS credentials
; (WIPE_CONFIG_ON_NEW_FW=0). Set =1 only to retest first-boot SETUP MODE.
; GitHub / SoftAP assets MUST be build_type=release (no -ggdb2). Debug
; embeds C:/Users/<name>/.platformio/packages/... in the .bin.
build_type = release
build_src_filter = +<*> -<touch_stock_main.cpp>
build_flags =
  ${env.build_flags}
  ; Keep WARN+; CORE_DEBUG_LEVEL=3 floods NimBLE "New advertiser" and starves loop.
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -DWIPE_CONFIG_ON_NEW_FW=0
  -DVICTRONDASH_VERSION=\"0.3.8\"

[env:bringup_lcd]
; Same firmware for now (LCD path used by Stage A UI)
build_src_filter = +<*> -<touch_stock_main.cpp>

[env:bringup_touch]
; Gold-standard CST816S acceptance test (src/touch_stock_main.cpp).
;   pio run -e bringup_touch -t upload
;   pio device monitor -e bringup_touch
; Pass: gesture/XY prints + int_edges rises while touching.
; Fail: int_edges stays 0 on ≥2 boards → missing CTP → RMA.
extends = env
build_src_filter = +<touch_stock_main.cpp>
lib_deps =
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -Iinclude
  -DUSE_TOUCH_SWIPE=1
  -DCORE_DEBUG_LEVEL=1
